    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f2f4f7;
    font-family: Arial, sans-serif;
}

.register-box {
    width: 400px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
}

.register-box h1 {
    text-align: center;
    margin-bottom: 8px;
}

.register-box > p {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #007bff;
}

button {
    padding: 13px;
    border: none;
    border-radius: 6px;
    background: #007bff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

.login-text {
    margin-top: 20px;
}

.login-text a {
    color: #007bff;
    text-decoration: none;
}


/* Mobile */
@media (max-width: 500px) {

    .register-box {
        width: 90%;
        padding: 25px;
    }

}


    </style>
